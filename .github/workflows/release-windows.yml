name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag must match the package version: v$version"
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        run: pnpm tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          gh release upload $env:RELEASE_TAG $installers[0].FullName --repo $env:GITHUB_REPOSITORY
